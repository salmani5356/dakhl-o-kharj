name: Create signing key (run once)
on:
  workflow_dispatch:
    inputs:
      password:
        description: "Key password (min 8 chars)"
        required: true
jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate
        run: |
          keytool -genkeypair -v -keystore release.jks -alias spendbook -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.password }}" -keypass "${{ inputs.password }}" \
            -dname "CN=SpendBook, O=SpendBook, C=IR"
          base64 -w0 release.jks > keystore.b64
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            release.jks
            keystore.b64
          retention-days: 1
