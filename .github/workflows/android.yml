name: Build Android
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: pip install pillow
      - run: npm install
      - run: npx cap add android
      - run: python3 tools/prepare_android.py
      - run: npx cap sync android
      - name: Prepare signing (if secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          fi
      - name: Build
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 3.0.${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: spendbook-android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/release/*.aab
