<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ef8a64">
<title>دخل و خرج | Dakhl o Kharj</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دخل و خرج">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ============ فونت‌ها (محلی، بدون نیاز به اینترنت) ============ */
@font-face{font-family:'Vazirmatn';font-weight:400;font-display:swap;src:url('fonts/Vazirmatn-Regular.woff2') format('woff2');}
@font-face{font-family:'Vazirmatn';font-weight:700;font-display:swap;src:url('fonts/Vazirmatn-Bold.woff2') format('woff2');}
@font-face{font-family:'Poppins';font-weight:400;font-display:swap;src:url('fonts/poppins-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:'Poppins';font-weight:700;font-display:swap;src:url('fonts/poppins-latin-700-normal.woff2') format('woff2');}

/* ============ رنگ‌ها (روشن / تیره) ============ */
:root{
  /* فاصلهٔ ایمن (ناچ، نوار وضعیت، نوار ناوبری): هم env() مرورگر و هم متغیرهای Capacitor روی اندروید */
  --sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));
  --sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));
  --cream:#fff6e4; --card:#fffdf4; --paper:#ffffff; --line:#f1dfb5; --dot:#efdcaa; --navbg:rgba(255,253,244,.96);
  --tq:#e8764f; --tq-d:#bd512d; --gr:#86ad4f; --gr-d:#5a822f;
  --pu:#c98aa3; --pu-d:#8f4a69; --bad:#d9574a; --bad-d:#b23f33; --warn:#ffb74d;
  --ink:#4a3042; --soft:#8f7a82; --r:20px; --shadow:0 6px 18px rgba(143,74,105,.12);
}
:root[data-theme=dark]{
  --cream:#241a1e; --card:#33252b; --paper:#40303a; --line:#5a4350; --dot:#33252b; --navbg:rgba(51,37,43,.97);
  --ink:#fbefe6; --soft:#cdb3bb; --pu-d:#f3b9d0; --gr-d:#b5d98a; --bad-d:#ff9a8f; --tq-d:#c9603c;
  --shadow:0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden}
html{-webkit-text-size-adjust:100%}
body{font-family:'Vazirmatn','Poppins',Tahoma,sans-serif;color:var(--ink);background:var(--cream);
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:22px 22px;
  min-height:100vh;padding-bottom:calc(96px + var(--sab));line-height:1.7;padding-top:var(--sat);overscroll-behavior-y:none}
html[lang=en] body{font-family:'Poppins','Vazirmatn',Tahoma,sans-serif;line-height:1.6}
.en{font-family:'Poppins','Vazirmatn',sans-serif;direction:ltr;unicode-bidi:isolate}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer;border:0;touch-action:manipulation}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

/* ============ هدر (حس سررسید با حلقه‌های فنر) ============ */
header{background:linear-gradient(135deg,var(--tq) 0%,#9fdcc0 55%,var(--pu) 130%);border-radius:0 0 var(--r) var(--r);padding:26px 0 18px;position:relative;box-shadow:var(--shadow);margin-bottom:14px}
header::before{content:"";position:absolute;top:7px;left:0;right:0;height:14px;
  background:radial-gradient(circle at 50% 50%,#fff8e1 0 5px,rgba(0,0,0,.18) 5.5px 7px,transparent 7.5px) 0 0/28px 14px repeat-x}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand h1{margin:0;font-size:1.7rem;line-height:1.2;color:#fff;text-shadow:0 2px 0 rgba(74,48,66,.22)}
html[lang=en] .brand h1,html[lang=ar] .brand h1.latin{font-family:'Poppins',sans-serif}
.brand small{display:block;font-family:'Poppins',sans-serif;direction:ltr;font-size:.8rem;letter-spacing:2px;color:#fff8e1}
html[dir=rtl] .brand small{text-align:right}
html[dir=ltr] .brand small{text-align:left}
.hbtns{display:flex;gap:8px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:rgba(255,248,225,.92);color:#4a3042;font-size:1.15rem;box-shadow:0 3px 8px rgba(0,0,0,.1)}
.iconbtn.on{background:var(--gr);color:#fff}
.bigdate{margin-top:14px;background:rgba(255,248,225,.92);color:#4a3042;border-radius:var(--r);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.bigdate .d{font-size:1.55rem;font-weight:700}
.bigdate .w{font-size:.95rem;color:#8f4a69;font-weight:700}
.tag{display:inline-block;background:var(--gr);color:#fff;border-radius:99px;padding:0 10px;font-size:.78rem;margin-inline-start:6px}

/* ============ اجزا ============ */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:1.05rem}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.muted{color:var(--soft);font-size:.88rem}
.btn{border-radius:14px;padding:10px 16px;background:var(--tq);color:#fff;font-weight:700;box-shadow:0 3px 0 var(--tq-d)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--tq-d)}
.btn.green{background:var(--gr);box-shadow:0 3px 0 var(--gr-d)}
.btn.purple{background:var(--pu);box-shadow:0 3px 0 var(--pu-d)}
.btn.red{background:var(--bad);box-shadow:0 3px 0 var(--bad-d)}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.block{width:100%}
.btn.sm{padding:6px 12px;font-size:.85rem}
input[type=text],input[type=search],input[type=password],textarea,select{width:100%;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px 12px;outline:0}
input[type=color]{width:44px;height:40px;padding:2px;border:2px solid var(--line);border-radius:12px;background:var(--paper)}
input:focus,textarea:focus,select:focus{border-color:var(--tq)}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:.88rem;font-weight:700;margin:10px 0 4px}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.monthnav .ml{font-weight:700;font-size:1.1rem;text-align:center;flex:1}

.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:1 0 62px;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:8px 4px;text-align:center;position:relative}
.chip .wd{font-size:.75rem;color:var(--soft);white-space:nowrap}
.chip .dn{font-size:1.25rem;font-weight:700}
.chip.sel{background:var(--tq);border-color:var(--tq-d);color:#fff}
.chip.sel .wd{color:#ffe9dd}
.chip.today::after{content:"";position:absolute;top:5px;inset-inline-start:6px;width:8px;height:8px;border-radius:50%;background:var(--gr)}
.chip .dot{display:block;width:6px;height:6px;border-radius:50%;background:var(--pu);margin:2px auto 0}
.chip:not(.has) .dot{background:transparent}

.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center}
.sum b{display:block;font-size:1rem;margin-top:2px;word-break:break-all}
.sum span{font-size:.78rem;color:var(--soft)}
.pos{color:var(--gr-d)} .neg{color:var(--bad-d)} .pur{color:var(--pu-d)}

.tx{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:10px;margin-bottom:8px}
.tx .top{display:flex;align-items:center;gap:10px;cursor:pointer}
.tx .em{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;flex:none}
.tx .mid{flex:1;min-width:0}
.tx .t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t2{font-size:.8rem;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:700;white-space:nowrap;font-size:.95rem;text-align:end}
.tx .acts{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:2px dashed var(--line)}
.tx .acts button{flex:1;background:var(--cream);border:2px solid var(--line);border-radius:12px;padding:6px 4px;font-size:.85rem}
.dayh{font-weight:700;color:var(--pu-d);margin:14px 4px 6px;font-size:.92rem}
.empty{text-align:center;color:var(--soft);padding:26px 10px}
.empty .big{font-size:2.4rem}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:flex;background:var(--paper);border:2px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{background:transparent;padding:8px 12px;font-size:.88rem}
.seg button.on{background:var(--pu);color:#fff;font-weight:700}

.bar{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:.86rem}
.bar .nm{width:92px;flex:none}
.bar .tr{flex:1;height:14px;background:var(--paper);border:1.5px solid var(--line);border-radius:99px;overflow:hidden}
.bar .fl{height:100%;border-radius:99px}
.bar .vl{width:104px;text-align:end;flex:none;font-size:.8rem}
.donutbox{display:flex;justify-content:center;margin-bottom:6px}
.donut{width:130px;height:130px;border-radius:50%;position:relative}
.donut::after{content:"";position:absolute;inset:26px;background:var(--card);border-radius:50%}
.cmp{display:flex;justify-content:space-between;gap:6px;padding:8px 2px;border-bottom:1.5px dashed var(--line)}
.cmp:last-child{border:0}
.ycols{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:8px}
.ycol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.ycol .pair{display:flex;gap:2px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.ycol .pair i{display:block;width:42%;border-radius:6px 6px 0 0;min-height:2px}
.ycol small{font-size:.62rem;color:var(--soft);margin-top:4px;white-space:nowrap}
.dcols{display:flex;align-items:flex-end;gap:2px;height:90px}
.dcols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.dcols i{display:block;width:100%;background:var(--pu);border-radius:4px 4px 0 0;min-height:2px}
.dcols small{font-size:.55rem;color:var(--soft);height:12px}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--soft);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:7px 4px;text-align:center;border-bottom:1.5px dashed var(--line)}
th{color:var(--soft);font-weight:700;font-size:.78rem}
td:first-child,th:first-child{text-align:start}
.prog{height:12px;background:var(--paper);border:1.5px solid var(--line);border-radius:99px;overflow:hidden;margin:4px 0}
.prog i{display:block;height:100%;border-radius:99px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:8px 10px}
.kv span{display:block;font-size:.76rem;color:var(--soft)}
.kv b{font-size:.95rem}
.accs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.accs div{flex:1 0 120px;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:8px 10px;text-align:center}
.accs span{display:block;font-size:.78rem;color:var(--soft)}
.banner{background:#fff3cd;color:#5a4a1b;border:2px solid #ffe08a;border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
:root[data-theme=dark] .banner{background:#3d3520;color:#ffe9a8;border-color:#6b5a22}

.note{background:#fff9c4;color:#4a3042;border-radius:6px 6px 18px 6px;padding:12px 14px;margin-bottom:10px;border:2px solid #f1e69a;box-shadow:2px 3px 0 rgba(0,0,0,.05)}
.note:nth-child(3n+2){background:#e0f7fa;border-color:#b2ebf2}
.note:nth-child(3n){background:#ede7f6;border-color:#d1c4e9}
.note .nd{font-size:.78rem;opacity:.7;margin-bottom:4px}
.note .nb{white-space:pre-wrap;word-break:break-word}
.note .acts{margin-top:8px;display:flex;gap:6px}
.note .btn.ghost{color:#4a3042;background:rgba(255,255,255,.7)}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--navbg);backdrop-filter:blur(8px);border-top:2px solid var(--line);border-radius:var(--r) var(--r) 0 0;z-index:20;padding-bottom:var(--sab)}
nav .in{max-width:760px;margin:0 auto;display:flex}
nav button{flex:1;min-width:0;background:transparent;padding:8px 2px 7px;font-size:.7rem;color:var(--soft);display:flex;flex-direction:column;align-items:center;white-space:nowrap}
nav button span{font-size:1.3rem;line-height:1.3}
nav button.on{color:var(--pu-d);font-weight:700}
nav button.on span{transform:translateY(-2px) scale(1.12)}
.fab{position:fixed;bottom:calc(84px + var(--sab));inset-inline-end:18px;z-index:19;width:58px;height:58px;border-radius:50%;background:var(--gr);color:#fff;font-size:2rem;box-shadow:0 6px 14px rgba(90,130,47,.45);line-height:1}

.modal{position:fixed;inset:0;background:rgba(74,48,66,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--cream);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:var(--r) var(--r) 0 0;padding:18px 16px calc(24px + var(--sab));animation:up .22s ease;position:relative}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 6px;font-size:1.2rem;padding-inline-end:40px}
.sheet .x{position:absolute;top:12px;inset-inline-end:12px;width:34px;height:34px;border-radius:50%;background:var(--paper);border:2px solid var(--line);font-size:1rem}
.typebtns{display:flex;gap:8px}
.typebtns button{flex:1;padding:12px;border-radius:16px;background:var(--paper);border:2px solid var(--line);font-weight:700}
.typebtns button.on.buy{background:var(--pu);color:#fff;border-color:var(--pu-d)}
.typebtns button.on.sell{background:var(--gr);color:#fff;border-color:var(--gr-d)}
.amtbig{font-size:1.6rem!important;font-weight:700;text-align:center}
.words{text-align:center;color:var(--pu-d);font-size:.85rem;margin-top:2px}
.words:empty{display:none}
.qa{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;justify-content:center}
.qa button{background:var(--paper);border:2px solid var(--line);border-radius:99px;padding:3px 10px;font-size:.8rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.cchip{padding:6px 11px;border-radius:99px;border:2px solid var(--line);background:var(--paper);font-size:.85rem}
.cchip.on{font-weight:700}
.dates{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}
.mrow{display:flex;gap:6px;align-items:center;margin:8px 0}
.mrow input[type=text]{padding:8px 10px}
.mrow .e{width:54px;text-align:center;flex:none}
.mrow .mny{width:120px;flex:none}
.mrow .del{width:38px;height:38px;border-radius:12px;background:var(--paper);border:2px solid var(--line);flex:none}
.langbtns{display:grid;gap:12px;margin-top:16px}
.langbtns button{padding:16px;border-radius:18px;background:var(--paper);border:2px solid var(--line);font-size:1.2rem;font-weight:700}
.langbtns button:active{background:var(--tq);color:#fff}
.toast{position:fixed;bottom:calc(100px + var(--sab));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:10px 18px;border-radius:99px;z-index:99;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;max-width:92%;text-align:center;display:flex;gap:12px;align-items:center}
.toast.show{opacity:1}
.toast.act{pointer-events:auto}
.toast button{background:var(--gr);color:#fff;border-radius:99px;padding:2px 12px;font-weight:700}
.prem{background:linear-gradient(135deg,rgba(201,138,163,.25),rgba(232,118,79,.2));border-color:var(--pu)}
.prem ul,.card ul{margin:8px 0 12px;padding-inline-start:20px}

.lock{position:fixed;inset:0;z-index:300;background:linear-gradient(135deg,var(--tq),var(--pu));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;padding:20px;text-align:center}
.lock h2{margin:0}
.pdots{display:flex;gap:14px;direction:ltr}
.pdots i{width:16px;height:16px;border-radius:50%;border:2px solid #fff}
.pdots i.f{background:#fff}
.kp{display:grid;grid-template-columns:repeat(3,72px);gap:12px;direction:ltr}
.kp button{height:64px;border-radius:50%;background:rgba(255,255,255,.28);color:#fff;font-size:1.5rem;font-weight:700}
.kp button:active{background:rgba(255,255,255,.5)}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@media(min-width:600px){.sheet{border-radius:var(--r);margin-bottom:6vh}.modal{align-items:center}.fab{inset-inline-end:calc(50% - 360px)}}

/* ============ لمس هنری (v3.1): بافت کاغذ، لکه‌های رنگی، سایه‌های رنگی ============ */
:root{--grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .35  0 0 0 0 .55  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --shadow:0 10px 28px -8px rgba(143,74,105,.22),0 2px 6px rgba(143,74,105,.06)}
body{background-color:var(--cream);
  background-image:var(--grain),radial-gradient(60vmax 40vmax at 100% 18%,rgba(232,118,79,.20),transparent 60%),radial-gradient(55vmax 38vmax at 0% 62%,rgba(201,138,163,.22),transparent 60%),radial-gradient(40vmax 30vmax at 90% 100%,rgba(134,173,79,.16),transparent 60%);
  background-attachment:fixed;background-size:140px 140px,auto,auto,auto}
:root[data-theme=dark] body{background-image:var(--grain),radial-gradient(60vmax 40vmax at 100% 18%,rgba(232,118,79,.10),transparent 60%),radial-gradient(55vmax 38vmax at 0% 62%,rgba(201,138,163,.14),transparent 60%)}
header{border-radius:0 0 38px 38px;padding:30px 0 22px;overflow:hidden;
  background:radial-gradient(120px 120px at 92% 8%,rgba(255,248,225,.35),transparent 70%),radial-gradient(180px 140px at 8% 110%,rgba(134,173,79,.50),transparent 70%),linear-gradient(135deg,#f6b15f 0%,#ef8a64 52%,#c98aa3 108%)}
header::after{content:"";position:absolute;inset:auto -10% -34px -10%;height:70px;background:radial-gradient(60% 100% at 25% 0,rgba(255,248,225,.20),transparent 70%),radial-gradient(50% 100% at 80% 0,rgba(255,248,225,.14),transparent 70%);pointer-events:none}
header .wrap{position:relative;z-index:1}
.logoline{display:flex;align-items:center;gap:12px}
.badge{width:52px;height:52px;border-radius:18px;background:rgba(255,248,225,.95);display:grid;place-items:center;box-shadow:0 6px 14px rgba(74,48,66,.18),inset 0 0 0 2px rgba(255,255,255,.7);flex:none;transform:rotate(-6deg)}
.badge svg{width:36px;height:36px}
.brand h1{font-size:1.65rem;letter-spacing:-.2px}
.iconbtn{background:rgba(255,248,225,.88);backdrop-filter:blur(6px);border-radius:16px;box-shadow:0 4px 10px rgba(74,48,66,.12),inset 0 0 0 1.5px rgba(255,255,255,.6)}
.bigdate{background:linear-gradient(135deg,rgba(255,248,225,.96),rgba(255,248,225,.82));border-radius:24px;box-shadow:0 8px 18px -6px rgba(74,48,66,.25)}
.card{border:1.5px solid var(--line);border-radius:26px;background:linear-gradient(160deg,var(--card),color-mix(in srgb,var(--card) 88%,var(--pu) 12%));position:relative}
.card h3{display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--tq),var(--pu));flex:none}
.sum div{border-width:1.5px;border-radius:20px;background:linear-gradient(160deg,var(--paper),color-mix(in srgb,var(--paper) 90%,var(--tq) 10%))}
.tx{border-width:1.5px;border-radius:22px;transition:transform .15s}
.tx:active{transform:scale(.985)}
.tx .em{border-radius:16px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
.chip{border-width:1.5px;border-radius:22px}

const W1=['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه'],
  W10=['ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'],
  W20=['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'],
  W100=['','صد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'],
  WG=['','هزار','میلیون','میلیارد','هزار میلیارد'];
function w3(n){const p=[],h=Math.floor(n/100),r=n%100;if(h)p.push(W100[h]);
  if(r>=20){p.push(W20[Math.floor(r/10)]);if(r%10)p.push(W1[r%10]);}else if(r>=10)p.push(W10[r-10]);else if(r)p.push(W1[r]);
  return p.join(' و ');}
function numWords(n){
  if(!n||n>=1e15)return '';const g=[];while(n>0){g.push(n%1000);n=Math.floor(n/1000);}
  const parts=[];for(let k=g.length-1;k>=0;k--){if(!g[k])continue;parts.push(k===1&&g[k]===1?'هزار':(w3(g[k])+(k?' '+WG[k]:'')));}
  return parts.join(' و ');
}

const UI={tab:'today',view:TODAY,stripEnd:TODAY,year:0,fType:'all',fCat:'all',q:'',open:null};
const TABS=[['today','today'],['tx','tx'],['month','month'],['year','year'],['notes','notes'],['settings','settings']];
const rng=(y,m)=>[KEY(DN(y,m,1)),KEY(DN(y,m,MLEN(y,m)))];
const monthTx=(y,m)=>{const [a,b]=rng(y,m);return DB.tx.filter(x=>x.date>=a&&x.date<=b);};
const yearTx=y=>{const a=KEY(DN(y,1,1)),b=KEY(DN(y,12,MLEN(y,12)));return DB.tx.filter(x=>x.date>=a&&x.date<=b);};
function totals(list){let buy=0,sell=0;list.forEach(x=>{x.type==='buy'?buy+=x.amount:sell+=x.amount;});return{buy,sell,diff:sell-buy};}
function catSums(list,type){const m={};list.filter(x=>x.type===type).forEach(x=>{m[x.cat]=(m[x.cat]||0)+x.amount;});
  return Object.entries(m).map(([id,v])=>({id,v})).sort((a,b)=>b.v-a.v);}
const balance=a=>DB.tx.reduce((s,x)=>x.acct===a.id?s+(x.type==='sell'?x.amount:-x.amount):s,a.init||0);
function pct(cur,prev){if(prev===0)return cur===0?null:'new';return Math.round((cur-prev)/Math.abs(prev)*100);}
function pctHtml(cur,prev,goodUp){
  const p=pct(cur,prev);if(p===null)return '<span class="muted">—</span>';
  if(p==='new')return `<span class="pur">${t('p.new')}</span>`;
  if(p===0)return `<span class="muted">${t('p.same')}</span>`;
  return `<span class="${(goodUp?p>0:p<0)?'pos':'neg'}">${p>0?'▲':'▼'} ${nf(Math.abs(p))}%</span>`;
}
function monthStats(y,m){
  const list=monthTx(y,m),buys=list.filter(x=>x.type==='buy'),len=MLEN(y,m),tp=P(TODAY),isCur=tp.y===y&&tp.m===m;
  const elapsed=isCur?tp.d:len,tt=totals(list),avg=tt.buy/Math.max(1,elapsed);
  const byDay=Array(len).fill(0);buys.forEach(x=>{byDay[P(KDN(x.date)).d-1]+=x.amount;});
  const pl={};buys.forEach(x=>{if(x.place){const k=x.place.trim();pl[k]=(pl[k]||0)+x.amount;}});
  const maxDay=Math.max(...byDay);
  return{list,t:tt,len,isCur,avg,proj:isCur?avg*len:tt.buy,byDay,
    biggest:buys.reduce((b,x)=>(!b||x.amount>b.amount)?x:b,null),
    busiest:maxDay>0?{d:byDay.indexOf(maxDay)+1,v:maxDay}:null,
    places:Object.entries(pl).sort((a,b)=>b[1]-a[1]).slice(0,5)};
}
function streak(){
  const Sx=new Set(DB.tx.map(x=>x.date));const has=dn=>{const k=KEY(dn);return Sx.has(k)||DB.noSpend[k];};
  let dn=TODAY,n=0;if(!has(dn))dn--;
  while(has(dn)&&n<5000){n++;dn--;}return n;
}
function budgetMsg(dateKey,catId){
  const p=P(KDN(dateKey)),list=monthTx(p.y,p.m).filter(x=>x.type==='buy'),b=DB.budgets,msgs=[];
  const tot=list.reduce((s,x)=>s+x.amount,0);
  if(b.total>0){if(tot>=b.total)msgs.push(t('b.w100'));else if(tot>=b.total*.8)msgs.push(t('b.w80'));}
  const cl=b.cats[catId];if(cl){const sp=list.filter(x=>x.cat===catId).reduce((a,x)=>a+x.amount,0),nm=cname(catOf(catId));
    if(sp>=cl)msgs.push(t('b.c100',nm));else if(sp>=cl*.8)msgs.push(t('b.c80',nm));}
  return msgs.join(' · ');
}
// تراکنش‌های ثابت ماهانه (فقط چیزهایی که خود کاربر تعریف کرده؛ بر اساس تقویمی که هنگام ساخت انتخاب شده)
function runRecurring(){
  let added=0;
  DB.recs.forEach(r=>{
    if(!r.active||r.mode==='remind')return;const tp=partsC(r.cal,TODAY);
    let cur=r.last?nextMonth({y:+r.last.slice(0,4),m:+r.last.slice(5)}):{y:r.startY,m:r.startM},g=0;
    while((cur.y<tp.y||(cur.y===tp.y&&cur.m<=tp.m))&&g++<36){
      const dn=dnC(r.cal,cur.y,cur.m,Math.min(r.day,mlenC(r.cal,cur.y,cur.m)));if(dn>TODAY)break;
      DB.tx.push({id:uid(),created:Date.now()+added,type:r.type,amount:r.amount,note:r.note,place:r.place||'',cat:r.cat,acct:r.acct,date:KEY(dn),rec:r.id});
      added++;r.last=`${cur.y}-${pad(cur.m)}`;cur=nextMonth(cur);
    }
  });
  if(added)save();return added;
}


/* ==========================================================
   سررسیدها و هشدار (آلارم): اجاره، قسط، شارژ…
   حالت «یادآوری»: روی صفحهٔ «امروز» کارت سررسید می‌آید و کاربر بعد از پرداخت ثبتش می‌کند.
   روی اندروید (Capacitor) با اعلان محلی در ساعت دلخواه هشدار می‌دهد، حتی وقتی اپ بسته است.
   ========================================================== */
const recFirst=r=>r.last?nextMonth({y:+r.last.slice(0,4),m:+r.last.slice(5)}):{y:r.startY,m:r.startM};
const recDue=(r,c)=>dnC(r.cal,c.y,c.m,Math.min(r.day,mlenC(r.cal,c.y,c.m)));
function dueItems(){
  const out=[];
  DB.recs.forEach(r=>{if(!r.active||r.mode!=='remind')return;const c=recFirst(r),dn=recDue(r,c);
    if(dn-TODAY<=Math.max(3,r.rem.before))out.push({r,dn});});
  return out.sort((a,b)=>a.dn-b.dn);
}
function dueHtml(){
  const L=dueItems();if(!L.length)return '';
  return `<div class="card due"><h3>${t('due.title')}</h3>${L.map(({r,dn})=>{
    const c=catOf(r.cat),d=dn-TODAY,when=d===0?t('due.today'):d<0?t('due.over',nf(-d)):t('due.in',nf(d)),sign=r.type==='buy'?'−':'+';
    return `<div class="tx"><div class="top"><div class="em" style="${cstyle(c)}">${ce(c)}</div><div class="mid"><div class="t1">${esc(r.note||cname(c))}</div><div class="t2 ${d<0?'neg':''}">${when} · ${esc(loc(dn))}</div></div>
      <div class="amt ${r.type==='buy'?'neg':'pos'}"><bdi>${sign}${mv(r.amount)}</bdi></div></div>
      <div class="acts"><button onclick="dueDo('${r.id}','pay')">${ico('inn')} ${t('due.pay')}</button><button onclick="dueDo('${r.id}','skip')">${t('due.skip')}</button></div></div>`;}).join('')}</div>`;
}
function dueDo(id,act){
  const r=DB.recs.find(x=>x.id===id);if(!r)return;const c=recFirst(r),dn=recDue(r,c);
  if(act==='pay')DB.tx.push({id:uid(),created:Date.now(),type:r.type,amount:r.amount,note:r.note,place:r.place||'',cat:r.cat,acct:r.acct,date:KEY(Math.min(dn,TODAY)),rec:r.id});
  r.last=`${c.y}-${pad(c.m)}`;save();syncReminders();render();toast(t(act==='pay'?'due.paid':'due.skipped'));
}
const LN=()=>NATIVE&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
const notifId=(id,c)=>{let h=7;const s=id+c.y+'-'+c.m;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)%2000000000+1;};
async function notifReady(ask){
  const ln=LN();if(!ln)return false;
  try{
    let p=await ln.checkPermissions();
    if(p.display!=='granted'&&ask)p=await ln.requestPermissions();
    if(p.display!=='granted')return false;
    try{await ln.createChannel({id:'dues',name:t('ntf.chan'),importance:5,visibility:1,vibration:true});}catch(e){}
    return true;
  }catch(e){return false;}
}
let _syncT=null;
function syncReminders(){clearTimeout(_syncT);_syncT=setTimeout(doSync,500);}
async function doSync(){
  const ln=LN();if(!ln)return;
  try{
    const pend=await ln.getPending();
    if(pend&&pend.notifications&&pend.notifications.length)await ln.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    if(!DB.recs.some(r=>r.active&&r.rem.on))return;
    if(!await notifReady(false))return;
    const list=[],now=Date.now();
    DB.recs.forEach(r=>{
      if(!r.active||!r.rem.on)return;
      let c=recFirst(r),n=0,g=0;const [hh,mm]=r.rem.time.split(':').map(Number);
      while(n<6&&g++<40){
        const dn=recDue(r,c),gd=d2g(dn-r.rem.before),at=new Date(gd.gy,gd.gm-1,gd.gd,hh,mm,0);
        if(at.getTime()>now){
          list.push({id:notifId(r.id,c),title:'⏰ '+(r.note||cname(catOf(r.cat))),
            body:`${money(r.amount)} ${unit()} · ${t('ntf.due',loc(dn))}`,schedule:{at,allowWhileIdle:true},channelId:'dues',extra:{rec:r.id}});n++;
        }
        c=nextMonth(c);
      }
    });
    if(list.length)await ln.schedule({notifications:list});
  }catch(e){}
}
function hookNotifTap(){
  const ln=LN();if(!ln)return;
  try{ln.addListener('localNotificationActionPerformed',()=>{if(!$('lock')){closeModal();go('today');}});}catch(e){}
  try{const A=window.Capacitor.Plugins.App;if(A)A.addListener('appStateChange',st=>{if(st&&st.isActive){const n=runRecurring();render();if(n)toast(t('r.created',nf(n)));syncReminders();}});}catch(e){}
}

function rMonth(m){
  const v=P(UI.view),y=v.y,mo=v.m,Sm=monthStats(y,mo),pm=prevMonth(y,mo),Pt=totals(monthTx(pm.y,pm.m)),tt=Sm.t;

// قالب‌بندی مبلغ هنگام تایپ (با پشتیبانی از اعشار برای ارزهای دارای سنت)
function fmtAmt(el){
  const dec=CUR().dec;let raw=normDigits(el.value).replace(/[٬,\s]/g,'').replace(/٫/g,'.').replace(/[^\d.]/g,'');
  if(!dec){const v=parseInt(raw,10)||0;el.value=v?money(v):'';}
  else{
    let [i,f]=raw.split('.');i=(i||'').replace(/^0+(?=\d)/,'');const dot=raw.includes('.');
    const gi=i?i.replace(/\B(?=(\d{3})+(?!\d))/g,GS()):(dot?'0':'');
    const out=gi+(dot?DS()+(f||'').slice(0,dec):'');el.value=LANG==='fa'?toFaDigits(out):out;
  }
  updateWords();
}
function fmtAmt2(el){const v=parseMoney(el.value);el.value=v?money(v):'';}
function addAmt(n){const el=$('fAmt');el.value=n?money(parseMoney(el.value)+n):'';updateWords();}
function updateWords(){
  const el=$('fWords');if(!el)return;const c=DB.settings.currency,w=(LANG==='fa'&&(c==='toman'||c==='rial'))?numWords(parseMoney($('fAmt').value)):'';
  el.textContent=w?w+' '+unit():'';
}

  const last=[...DB.tx].reverse().find(x=>x.note===v);if(!last)return;
  if(!$('fAmt').value){$('fAmt').value=money(last.amount);updateWords();}
  if(!$('fPlace').value)$('fPlace').value=last.place||'';
  if(!FORM.catTouched){FORM.cat=last.cat;FORM.type=last.type;}
  drawForm();
}

  const dn=DN(+$('dY').value,+$('dM').value,+$('dD').value),date=KEY(dn);

async function hashPin(pin,salt){
  const data=new TextEncoder().encode(salt+':'+pin);
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}}catch(e){}
  let h=0x811c9dc5;for(const c of data){h^=c;h=Math.imul(h,16777619)>>>0;}return 'f'+h.toString(16);
}
let PIN_BUF='',PIN_FAILS=0,LOCK_CB=null,hiddenAt=0;
function showLock(cb){
  if($('lock'))return;LOCK_CB=cb;PIN_BUF='';
  const el=document.createElement('div');el.className='lock';el.id='lock';
  el.innerHTML=`<div style="font-size:3rem">🔒</div><h2>${esc(t('brand'))}</h2><div id="lockMsg">${t('pin.enter')}</div><div class="pdots" id="pdots"></div>
    <div class="kp">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button onclick="pinKey('${k}')">${k}</button>`).join('')}</div>`;
  document.body.appendChild(el);drawPin();
}
function drawPin(){$('pdots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<PIN_BUF.length?'f':''}"></i>`).join('');}
async function pinKey(k){
  if(k==='⌫')PIN_BUF=PIN_BUF.slice(0,-1);else if(PIN_BUF.length<4)PIN_BUF+=k;drawPin();
  if(PIN_BUF.length<4)return;
  const ok=(await hashPin(PIN_BUF,DB.settings.salt))===DB.settings.pin;
  if(ok){PIN_FAILS=0;const el=$('lock');if(el)el.remove();const cb=LOCK_CB;LOCK_CB=null;if(cb)cb();}
  else{PIN_FAILS++;PIN_BUF='';drawPin();const d=$('pdots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');
    $('lockMsg').textContent=PIN_FAILS>=5?t('pin.forgot'):t('pin.wrong');}
}
document.addEventListener('keydown',e=>{if(!$('lock'))return;if(/^[0-9]$/.test(e.key))pinKey(e.key);else if(e.key==='Backspace')pinKey('⌫');});

};
const Snap={
  async list(){try{return (await IDB.get('snaps'))||[];}catch(e){return [];}},
  async add(label,force){
    try{const l=await this.list(),day=KEY(TODAY);
      if(!force&&(l.some(s=>s.day===day)||(!DB.tx.length&&!DB.notes.length)))return;
      if(force&&!DB.tx.length&&!DB.notes.length)return;
      l.unshift({day,ts:Date.now(),label:label||t('bk.lblAuto'),n:DB.tx.length,json:JSON.stringify(DB)});await IDB.set('snaps',l.slice(0,8));}catch(e){}
  }
};
async function openSnaps(){
  const l=await Snap.list();
  openModal(`<h2>${t('bk.snapT')}</h2><div class="muted">${t('bk.snapHint',nf(8))}</div>
    ${l.length?l.map((s,i)=>`<div class="cmp"><span>${fmtKey(s.day,false)}<br><span class="muted">${esc(s.label)} · ${t('bk.snapRow',nf(s.n))}</span></span><button class="btn ghost sm" onclick="restoreSnap(${i})">${t('bk.restore')}</button></div>`).join(''):`<div class="empty">${t('bk.snapNone')}</div>`}`);
}
async function restoreSnap(i){
  const l=await Snap.list(),s=l[i];if(!s)return;
  try{await Snap.add(t('bk.lblBefore'),true);const keep={pin:DB.settings.pin,salt:DB.settings.salt};DB=normalizeDB(JSON.parse(s.json));Object.assign(DB.settings,keep);if(!DB.settings.lang)DB.settings.lang=LANG;save();syncReminders();applyLang();UI.year=P(UI.view).y;closeModal();toast(t('bk.snapDone'));}
  catch(e){toast(t('bk.snapFail'));}
}

/* ==========================================================
   بخش ۱۱: موزیک (آهنگ آپلودی یا موزیک آرام تولیدشده)
   ========================================================== */
const Music={
  playing:false,name:'',audio:null,url:null,ctx:null,master:null,timer:null,step:0,
  async init(){try{const r=await IDB.get('music');if(r&&r.blob)this.setBlob(r.blob,r.name);}catch(e){}},
  setBlob(blob,name){if(this.url)URL.revokeObjectURL(this.url);this.url=URL.createObjectURL(blob);this.name=name||t('mu.mine');this.audio=new Audio(this.url);this.audio.loop=true;this.audio.volume=.5;},
  toggle(){this.playing?this.stop():this.start();},
  start(){
    if(this.audio){this.audio.play().then(()=>{this.playing=true;render();}).catch(()=>toast(t('mu.fail')));return;}
    if(this.startAmbient()){this.playing=true;render();}
  },
  stop(){if(this.audio)this.audio.pause();this.stopAmbient();this.playing=false;render();},
  startAmbient(){
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC){toast(t('mu.nosup'));return false;}
    this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=0;this.master.connect(this.ctx.destination);
    this.master.gain.linearRampToValueAtTime(.16,this.ctx.currentTime+2);
    const chords=[[220,277.18,329.63,440],[196,246.94,293.66,392],[174.61,220,261.63,349.23],[196,246.94,329.63,392]];
    const play=()=>{const c=this.ctx;if(!c)return;const tm=c.currentTime,ch=chords[this.step++%chords.length];
      ch.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type=i===3?'triangle':'sine';o.frequency.value=f;o.detune.value=(Math.random()-.5)*10;
        g.gain.setValueAtTime(0,tm);g.gain.linearRampToValueAtTime(i===3?.18:.5,tm+2.4);g.gain.linearRampToValueAtTime(0,tm+7);
        o.connect(g);g.connect(this.master);o.start(tm);o.stop(tm+7.2);});};
    play();this.timer=setInterval(play,6000);return true;
  },
  stopAmbient(){
    if(this.timer){clearInterval(this.timer);this.timer=null;}
    if(this.ctx){const c=this.ctx;try{this.master.gain.cancelScheduledValues(c.currentTime);this.master.gain.linearRampToValueAtTime(0,c.currentTime+.4);}catch(e){}
      setTimeout(()=>c.close().catch(()=>{}),600);this.ctx=null;}
  },
  async upload(file){
    if(this.playing)this.stop();this.setBlob(file,file.name.replace(/\.[^.]+$/,''));
    try{await IDB.set('music',{blob:file,name:this.name});}catch(e){toast(t('mu.saveFail'));}
    this.start();toast(t('mu.loaded'));
  },
  async clear(){
    if(this.playing)this.stop();if(this.url)URL.revokeObjectURL(this.url);this.audio=null;this.url=null;this.name='';
    try{await IDB.del('music');}catch(e){}render();toast(t('mu.removed'));
  }
};
$('musicFile').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  if(!f.type.startsWith('audio/')){toast(t('mu.notAudio'));return;}Music.upload(f);
});

/* ==========================================================
   بخش ۱۲: PWA (نصب روی گوشی) و اپ اندروید (Capacitor)
   ========================================================== */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !NATIVE){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(UI.tab==='settings')render();});
window.addEventListener('appinstalled',()=>{deferredInstall=null;});
const isStandalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
function installApp(){
  if(deferredInstall){deferredInstall.prompt();deferredInstall=null;return;}
  openModal(`<h2>${t('in.title')}</h2><p>${t('in.android')}</p><p>${t('in.ios')}</p><p class="muted">${t('in.note')}</p>`);
}
// دکمهٔ بازگشت اندروید: بستن پنجره ← رفتن به «امروز» ← خروج
function hookBackButton(){
  try{
    const App=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;if(!NATIVE||!App)return;
    App.addListener('backButton',()=>{
      if($('lock'))return;
      if($('modalRoot').innerHTML){closeModal();return;}
      if(UI.tab!=='today'){go('today');return;}
      App.exitApp();
    });
  }catch(e){}
}

/* ==========================================================
   بخش ۱۳: شروع برنامه
   ========================================================== */
function boot(){
  load();applyLang();UI.year=P(UI.view).y;applyTheme();
  if(window.matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(e){}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){} // درخواست ماندگاری داده
  const n=runRecurring();Snap.add();Music.init();hookBackButton();hookNotifTap();syncReminders();
  const start=()=>{render();if(n)toast(t('r.created',nf(n)));if(!DB.settings.lang)openLangPicker();};
  if(DB.settings.pin)showLock(start);else start();
}
boot();
</script>
